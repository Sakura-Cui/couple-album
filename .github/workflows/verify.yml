name: Verify and capture showcase
on:
  push:
    branches: [main]
    paths: ['android/**', 'backend/**', 'scripts/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - run: python -m pytest -q --junitxml=../test-results/backend.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: test-results
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r backend/requirements-dev.txt -c backend/constraints.txt
          bash scripts/qa-certificate.sh
          python scripts/showcase_server.py > /tmp/showcase-server.log 2>&1 &
          for i in {1..60}; do
            if curl --cacert .tools/qa-tls/cert.pem -fsS https://127.0.0.1:18444/health; then break; fi
            sleep 1
          done
          test -f .tools/showcase-invite
      - run: bash gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
        working-directory: android
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.sakura.romance.debug android.permission.POST_NOTIFICATIONS
            adb shell pm grant com.sakura.romance.debug android.permission.ACCESS_COARSE_LOCATION
            adb shell am instrument -w -r -e class com.sakura.romance.ShowcaseFlowTest -e invite "$(cat .tools/showcase-invite)" com.sakura.romance.debug.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/showcase-instrumentation.log
            mkdir -p showcase-capture
            adb shell run-as com.sakura.romance.debug ls files | tr -d '\r' | grep '^showcase-.*\.png$' | while read name; do adb exec-out run-as com.sakura.romance.debug cat "files/$name" > "showcase-capture/$name"; done
            adb logcat -d -s AndroidRuntime > /tmp/showcase-crashes.log
            test "$(find showcase-capture -name '*.png' | wc -l)" -ge 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-showcase
          path: |
            showcase-capture
            android/app/build/test-results
            /tmp/showcase-*.log

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=auth:1m rate=2r/s;
    upstream sakura_api { server api:8000; keepalive 4; }
    server {
        listen 9443 ssl;
        ssl_certificate /certs/ip/fullchain.pem;
        ssl_certificate_key /certs/ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 16m;
        client_body_timeout 120s;
        send_timeout 120s;
        add_header X-Content-Type-Options nosniff always;
        location ~ ^/api/(bind|unlock|password)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://sakura_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://sakura_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 120s;
        }
    }
}
